[package]
name = "api"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "dsecure-api"
path = "src/main.rs"

[features]
# POST /api/v1/dev/fixtures: sirf debug build + is feature + DSECURE_ENV dev/test mein register hota hai.
# Release build mein `debug_assertions` off hai, isliye route compile hi nahi hota.
dev-fixtures = []

[dependencies]
common = { workspace = true }
config = { workspace = true }
domain = { workspace = true }
auth = { workspace = true }
crypto = { workspace = true }
db = { workspace = true }
audit = { workspace = true }
storage = { workspace = true }
telemetry = { workspace = true }
# Workspace deps table mein nahi hai: RUN_MODE=all/workers ke liye job runner (path dep, same workspace).
workers = { path = "../workers" }

async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# catch_unwind around idempotent handlers (release the key on panic).
futures-util = { workspace = true }
metrics = { workspace = true }
moka = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# "net": TcpListener (workspace tokio feature set mein nahi).
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
# Workspace mein nahi: body limit wrapper (Limited) + trusted proxy CIDR parsing.
http-body-util = "0.1.3"
# Own accept loop (header-read timeout + max connections, `server.rs`).
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "http1", "service"] }
ipnet = "2.11"

# jemalloc sirf Linux par (Windows par path-with-spaces build issue, PHASE0_PROGRESS item 5).
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true }
telemetry = { workspace = true, features = ["jemalloc"] }

[dev-dependencies]
db = { workspace = true, features = ["test-fixtures"] }
domain = { workspace = true, features = ["test-fixtures"] }
futures-util = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
