[package]
name = "testkit"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Test-only crate: nothing in the production dependency graph depends on it (no crate lists it).
[[bin]]
name = "dsecure-loadtest"
path = "src/bin/loadtest.rs"

[dependencies]
common = { workspace = true }
config = { workspace = true }
crypto = { workspace = true }
domain = { workspace = true, features = ["test-fixtures"] }
auth = { workspace = true }
# test-fixtures: db::testing::{ScratchDb, raw_exec} and auth_state::testing_insert_staff.
db = { workspace = true, features = ["test-fixtures"] }
audit = { workspace = true }
storage = { workspace = true }
# api: route table (`route_policies`, `build_routes`), `assemble`, real middleware stack.
api = { path = "../api" }

aws-lc-rs = { workspace = true }
bytes = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# net/process/io-util: load driver (TCP client, child api process, line protocol).
tokio = { workspace = true, features = ["net", "process", "io-util", "fs"] }
tower = { workspace = true }
uuid = { workspace = true }
# Load driver HTTP/1.1 client (hyper is already in the lock file via axum; no new crate download).
http-body-util = "0.1.3"
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
