[package]
name = "db"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# test-fixtures: ClaimedJob::for_tests + db::testing (scratch DB harness) for other crates' tests.
[features]
test-fixtures = []

# Dependency rule (ARCHITECTURE.md §3): db -> common, domain, crypto, config. Kabhi auth/api nahi.
[dependencies]
common = { workspace = true }
config = { workspace = true }
crypto = { workspace = true }
domain = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
domain = { workspace = true, features = ["test-fixtures"] }
tokio = { workspace = true }
