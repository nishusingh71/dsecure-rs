# Render Blueprint: DSecure Rust API, STAGING only (docs/ops/RENDER_SETUP.md).
#
# Decisions (from the code, 20 Oct 2026):
# - One Docker web service with RUN_MODE=all: the api process also runs the job runner (outbox +
#   idempotency cleanup in Phase 0). DECISIONS.md D-02 recommends `--mode=all` for Phase 0-2; a second
#   Render service would be a second paid 512 MB instance for two tiny jobs. ARCHITECTURE.md §12.1
#   budgets ~230-260 MB worst case for the api; the Phase 0 job runner adds little (not measured).
# - Health check = GET /health/ready (db reachable, platform keys loaded, all migrations applied).
#   It answers 503 until migrations are applied, so a deploy against an unmigrated DB never goes live.
#   Trade-off: it also answers 503 during a short DB outage (2 s probe timeout, 5 s cache), and Render
#   may then mark the instance unhealthy and restart it. Kept on purpose (owner/reviewer decision); the
#   keep-alive cron uses /health/live instead (no DB query).
# - Secrets: `sync: false` = no value in this file; the owner types each value in the Render dashboard.
#   KEK_ENV_<id> has a generated name (see provision-keys output) and must be ADDED by hand in the
#   dashboard, because a Blueprint cannot declare a key whose name is not known in advance.
# - Not verified: plan name/price, region, Render's proxy CIDR, the onrender.com host name.
services:
  - type: web
    name: dsecure-api-staging
    runtime: docker
    # Owner (20 Oct 2026): free plan for staging (512 MB). It sleeps after ~15 min without traffic, so an
    # external cron (cron-job.org) calls GET /health/live every 5-10 min (no auth, no DB query).
    plan: free
    # Owner: Singapore for staging; Frankfurt planned for production.
    region: singapore
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    # Deploy only when the owner triggers it.
    autoDeploy: false
    envVars:
      # --- non-secret ---
      - key: DSECURE_ENV
        value: staging
      - key: RUN_MODE
        value: all
      - key: HTTP_ADDR
        value: 0.0.0.0:8080
      - key: PORT
        value: "8080"
      - key: DB_EXPECT_ENGINE
        value: tidb
      # CA bundle inside the distroless image (TiDB Cloud serverless uses a public CA).
      - key: DB_TLS_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: DB_MAX_CONNECTIONS
        value: "8"
      - key: KEK_PROVIDER
        value: env
      # No public OpenAPI document on the internet-facing staging service.
      - key: OPENAPI_PUBLIC
        value: "false"
      # Must equal the public URL of this service (change if the service name or a custom domain differs).
      - key: JWT_ISSUER
        value: https://dsecure-api-staging.onrender.com
      # UNVERIFIED ASSUMPTION: Render's edge proxy reaches the container from 10.0.0.0/8. Two risks:
      # (1) if any other host in 10/8 can reach this container directly, it can spoof X-Forwarded-For
      #     (fake client IPs for rate limits / audit ip_hmac);
      # (2) if the proxy is NOT in this range, X-Forwarded-For is ignored and every client shares the
      #     proxy's rate-limit bucket (logins throttled for everyone together).
      # Verify after the first deploy: docs/ops/RENDER_SETUP.md step 9 ("proxy check"), then narrow the range.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: TRUSTED_PROXY_CIDRS
        value: 10.0.0.0/8
      # Staging only: local ephemeral disk (production refuses `fs`).
      - key: BLOB_BACKEND
        value: fs
      - key: BLOB_FS_ROOT
        value: /tmp/dsecure-blobs
      - key: TOKIO_WORKER_THREADS
        value: "2"
      - key: TOKIO_MAX_BLOCKING_THREADS
        value: "4"
      - key: LOGIN_HASH_CONCURRENCY
        value: "3"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: _RJEM_MALLOC_CONF
        value: background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000,narenas:2
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: info
      # --- secrets / generated values: entered by the owner in the dashboard ---
      # App DB user (rs_app) URL: mysql://<prefix>.rs_app:<pw>@<host>:4000/dsecure_rs_staging?ssl-mode=VERIFY_IDENTITY
      # (MIGRATOR_DATABASE_URL / PLATFORM_ADMIN_DATABASE_URL are NOT set here: only the operator CLI uses them.)
      - key: DATABASE_URL
        sync: false
      # From `cargo xtask provision-keys` (file .dev/staging.keys.env). Not secret, but must match the file.
      - key: KEK_ENV_ACTIVE_ID
        sync: false
      - key: JWT_SIGNING_KID_MEMBER
        sync: false
      - key: JWT_SIGNING_KID_STAFF
        sync: false
      # Add by hand: KEK_ENV_<value of KEK_ENV_ACTIVE_ID> = the secret KEK line from the same file.
