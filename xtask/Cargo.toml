[package]
name = "xtask"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
api = { path = "../crates/api" }
config = { workspace = true }
db = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
crypto = { workspace = true }
zeroize = { workspace = true }
# provision-keys (staging keys + platform-admin seed): audit row hash, staff perm, timestamps.
audit = { workspace = true }
common = { workspace = true }
domain = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# P0-20 data-layer gates. Jaan-bujh kar `db` crate par dependency nahi: gates source files + local MySQL par
# chalte hain, db engineers ka mid-edit code xtask build/clippy na tode.
regex = "1"
secrecy = { workspace = true }
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# provision-keys seed-db test: local MySQL scratch DB harness (db::testing), never TiDB.
db = { workspace = true, features = ["test-fixtures"] }
futures-util = { workspace = true }
